<template>
    <lightning-card title="Demands">
        <div class="slds-p-horizontal_small">
            <div class="slds-grid slds-gutters" style="padding: 1rem;">
                <div class="slds-col">
                    <lightning-combobox name="project" data-id="project" label="Select Project" value={selectedProject}
                        placeholder="Select Project" options={filteredProjectOptions} disabled={disableProject}
                        onchange={handleChange} required></lightning-combobox>
                </div>
                 <div class="slds-col">
                    <lightning-combobox name="usageDescription" data-id="usageDescription" label="Usage Description" value={selectedUsageDescription}
                        placeholder="Select Usage Description" options={filteredUsageDescription} disabled={disableUsageDescription}
                        onchange={handleChange} required></lightning-combobox>
                </div> 
                <div class="slds-col">
                    <lightning-combobox name="tower" data-id="tower" label="Select Tower" value={selectedTower}
                        placeholder="Select Tower" options={filteredTowerOptions} onchange={handleChange}
                        required></lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-combobox name="demand" data-id="demand" label="Demand Type" value={selectedDemand}
                        placeholder="Select Demand" options={filteredDemandTypeOptions} onchange={handleChange}
                        required></lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-combobox name="demandStatus" data-id="status" label="Demand Status"
                        value={selectedDemandStatus} placeholder="Select Demand Status"
                        options={filteredDemandStatusOptions} onchange={handleChange} required></lightning-combobox>
                </div>
                <div class="slds-col">
                    <lightning-input type="date" name="input1" value={billingDateFrom} label="Actual Date From"
                        onchange={handleChange}></lightning-input>
                </div>
                <div class="slds-col">
                    <lightning-input type="date" name="input2" value={billingDateTo} label="Actual Date To"
                        onchange={handleChange}></lightning-input>
                </div>
                <div class="slds-col">
                    <lightning-input type="test" name="Customer Number" value={custNumber} label="Customer Number"
                        onchange={handleChange}></lightning-input>
                </div>
                <div style="padding-top: 1.5rem;">
                    <lightning-button variant="brand" icon-name="utility:search" label="Search"
                        onclick={handleClick}></lightning-button>
                </div>
                <br/>
            </div>
            <div class="slds-grid slds-gutters">
                <template if:true={errorMessage}>
                    <div class="slds-text-color_error">{errorMessage}</div>
                </template>
            </div>
           <!-- <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-1">-->
                    <div class="datatable-container">
                        <lightning-datatable 
                    key-field="id" data={paginatedData} columns={columns}
                    onrowselection={handleRowSelection} 
                    onrowaction={handleRowAction} selected-rows={selectedRows}
                    wrap-text-max-lines=3
                    min-column-width="150" 
                    max-column-width="300">
                </lightning-datatable>
                    </div>
                

                <!-- </div>
            </div> -->
                        <div class="slds-grid slds-grid_align-spread slds-var-m-top_medium slds-m-left_xx-small footerButtons">
                            <div>
                                <lightning-button 
                        variant="brand" 
                        disabled={isFirstPage}
                        label="Previous"
                        onclick={handlePreviousPage}
                        class="slds-m-left_xx-small">
                    </lightning-button>
                    <span>Page {currentPage} of {totalPages}</span>
                    <lightning-button 
                        variant="brand" 
                        disabled={isLastPage}
                        label="Next"
                        onclick={handleNextPage}
                        class="slds-m-left_xx-small">
                    </lightning-button>
                            </div>
                        </div>
           
   <!-- <button onclick={handlePreviousPage} disabled={isFirstPage}>Previous</button>
    
    <button onclick={handleNextPage} disabled={isLastPage}>Next</button>-->
    
        </div>
        <div slot="footer">
            <lightning-button variant="brand" icon-name="utility:privately_shared" label="Block Demand"
                onclick={handleClickBlockDemand} disabled={isBlockDemandDisabled}></lightning-button> &nbsp;
            <lightning-button variant="brand" icon-name="utility:share_file" label="Raise Demand"
                onclick={handleClickRaiseDemand} disabled={isRaiseDemandDisabled}></lightning-button>&nbsp;
            <lightning-button variant="brand" icon-name="utility:send" label="Send Demand"
                onclick={handleClickSendDemand} disabled={isSentDemandDisabled}></lightning-button>&nbsp;
            <!-- <lightning-button variant="brand" icon-name="utility:ban" label="Cancel Demand"
                onclick={handleClickCancelDemand} disabled={isCancelDemandDisabled}></lightning-button> -->
        </div>
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open ">
                <template if:true={isBlockDemand}>

                    <div class='slds-modal__container modal_New'>
                        <header class="slds-modal__header">
                            <button
                                class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse button-hover-effect"
                                title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close"
                                    size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 class="slds-text-heading_medium">Demand Update</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <c-eyi-block-demand-modal selected-demand-record={selectedDemandrecord} onclose={closeModal}
                                action={Action}>
                            </c-eyi-block-demand-modal>
                        </div>
                        <footer class="slds-modal__footer">
                        </footer>
                    </div>
                </template>
                <template if:false={isBlockDemand}>
                    <template if:true={isSpinner}>
                        <div class="component-spinner-container">
                            <lightning-spinner
                                alternative-text="Loading"
                                size="large"
                                variant="brand"
                                class="slds-spinner_inline"
                            ></lightning-spinner>
                        </div>
                        <div class="slds-backdrop slds-backdrop_open"></div>

                    </template>
              
                    <template if:false={isSpinner}>
                        <div class="slds-text-align_center slds-m-around_medium">
                            <span class="slds-text-color_weak">noProjMessage</span>
                        </div>                        
                        <div class="slds-backdrop slds-backdrop_open"></div>

                    </template>
                </template>
                
            </section>
        </template>
        <template if:true={isShowSpinner}>
            <!-- <div class="exampleHolder"> -->
                <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
            <!-- </div> -->
            <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->

        </template>
    </lightning-card>
</template>
