<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Receipts Approved</div>

<!-- Content Row -->
<div class="slds-grid slds-wrap">
    <!-- Column 1: Payment Done -->
    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
        <lightning-input 
            label="Payment done" 
            value={PAID_P} 
            disabled>
        </lightning-input>
    </div>

    <!-- Column 2: Reversal to Customer -->
    <div class="slds-col slds-size_1-of-2 slds-p-around_x-small">
        <lightning-input 
            label="Reversal to customer" 
            value={REFUND_P} 
            disabled>
        </lightning-input>
    </div>
</div>

<!-- Down Payment Amount-->
<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Down Payment Amount</div>
<!-- Grid Layout -->
<div class="slds-grid slds-wrap">

    <!-- Principal -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Principal" value={DOWNPAYMENT_P} disabled></lightning-input>
    </div>

    <!-- Tax -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Tax" value={DOWNPAYMENT_T} disabled></lightning-input>
    </div>

    <!-- Principal Reversed -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Principal Reserved" value={DOWNPAYMENT_P_R} disabled></lightning-input>
    </div>

    <!-- Tax Reversed -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Tax Reversed" value={DOWNPAYMENT_T_R} disabled></lightning-input>
    </div>

    <!-- Charged to Customer -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Charged To Customer" value={DOWNPAYMENT_CTC} disabled></lightning-input>
    </div>

</div>
<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Demanded Amount</div>

    <!-- Principal Reversed -->

        <lightning-input label="Principal Reversed" value={DEMAND_P_R} disabled></lightning-input>

    <!-- Tax Reversed -->
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input label="Tax Reversed" value={DEMAND_T_R} disabled></lightning-input>

    <!-- Charged to Customer -->

        <lightning-input label="Charged to Customer" value={Demand_CTC} disabled></lightning-input>
    </div>

</div>

<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Interest Charged to Customer</div>

<!-- Grid Layout -->
<div class="slds-grid slds-wrap">

    <!-- Total Interest Accrued (read-only) -->
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-input label="Total Interest Accrued" value={INTEREST_C} disabled></lightning-input>
    </div>

    <!-- Interest Waiver given to the customer (editable) -->
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-input 
            label="Interest waiver given to the customer"
            type="number"
            value={interestWaiver}
            onchange={handleInterestWaiverChange} disabled={isDataLoaded}>
        </lightning-input>
    </div>

    <!-- Total Interest to be charged to the customer (read-only) -->
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-input 
            label="Charged to Customer"
            value={totalInterestCharged}
            disabled>
        </lightning-input>
    </div>
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-input 
            label="Remarks"
            type="text"
            value={interestChargedRemark}
            onchange={handleInterestChargedRemark}
            disabled={isDataLoaded}>
        </lightning-input>
    </div>

</div>

       
<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Brokerage Amount</div>

<!-- Grid Layout -->

           <lightning-input type="number" label="Brokerage Total Amount"

    </div>
    <div class="slds-col slds-size_1-of-5 slds-p-around_x-small">
        <lightning-input 
            label="Total Brokerage Paid"

        </lightning-input>

</div>

<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Other Adjustments (if required)</div>

<!-- Grid Layout -->
<div class="slds-grid slds-wrap">

    <!-- Combobox: Other adjustments to be included? -->
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-combobox
            label="Other adjustments to be included?"
            name="yesNo"
            value={otherAdjustment}
            placeholder="Select an option"
            options={picklistOptions}
            onchange={handleOtherAdjustment}
            disabled={isDataLoaded}>
        </lightning-combobox>
    </div>

    <!-- Conditionally shown input -->
    <template if:true={showOtherAdjustmentValue}>
        <!-- Other adjustment refund input -->
        <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
            <lightning-input
                label="Other adjustments to be given as part of refund to the customer"
                name="OtherAdjustment"
                type="number"
                value={otherAdjustmentRefund}
                onchange={handleOtherAdjustmentRefund}
                disabled={isDataLoaded}>
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
        <lightning-input 
            label="Remarks"
            type="text"
            value={otherAdjustmentRemark}
            onchange={handleotherAdjustmentRemark}
            disabled={isDataLoaded}>
        </lightning-input>
    </div>
    </template>
    <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
            <lightning-input

                name="tdsAmount"
                type="number"
                value={tdsAmount}
                disabled>
            </lightning-input>
        </div>

</div>
<div class="slds-text-heading_medium slds-text-align_left slds-p-around_x-small  headerStyle">Forfeiture Amount</div>

<!-- Grid Layout -->
<div class="slds-grid slds-wrap">

    <!-- Combobox: Should an amount be forfeited? -->
    <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
        <lightning-combobox
            label="Should an amount be forfeited?"
            name="yesNo"
            value={forfeitedAmount}
            placeholder="Select an option"
            options={picklistOptions}
            onchange={handleForfeitedAmountChange}
            disabled={isDataLoaded}>
        </lightning-combobox>
    </div>

    <!-- Conditionally shown input -->
    <template if:true={showForfeitedAmount}>
        <!-- Amount forfeited input -->
        <div class="slds-col slds-size_1-of-3 slds-p-around_x-small">
            <lightning-input
                label="Amount forfeited from the refund to the customer"
                name="Amount forfeited"
                type="number"
                value={amountForfeitedRefund}
                onchange={handleAmountForfeitedRefund}
                disabled={isDataLoaded}>
            </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-6 slds-p-around_x-small">
        <lightning-input 
            label="Remarks"
            type="text"
            value={forfeitedRemark}
            onchange={handleotherForfeitedRemark}
            disabled={isDataLoaded}>
        </lightning-input>
    </div>
    </template>

</div>
<div class="slds-grid slds-wrap">
  <div class="slds-col slds-size_6-of-6 slds-p-around_x-small">
        <lightning-textarea data-id="financialRemark" label="Remarks for Finanace" value={financeRemarks}
                           onchange={handleFinanceRemarksChange}
                           disabled={isDataLoaded}></lightning-textarea>
    </div>  
</div>

            </label>
            <input
                type="checkbox"
                id="submitCheckbox"

                checked={isCancellationSubmit}

                disabled={isDataLoaded}
            />
        </div>
    </div>



        <!-- Save Button (conditionally rendered) -->
        
            <lightning-layout horizontal-align="center">
                <template if:true={showSaveButton}>
                    <lightning-layout-item flexibility="auto" padding="around-small">
                        <lightning-button label="Save" variant="brand" icon-name="utility:save" onclick={handleSave}></lightning-button>

                </template>

    </template>
    <template if:true={showError}>
        <div class="error-box">
            <p>Received error while fetching data from SAP</p>

        <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
