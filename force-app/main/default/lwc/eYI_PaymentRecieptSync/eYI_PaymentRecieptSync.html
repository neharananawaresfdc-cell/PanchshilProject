<template>
    <lightning-card title="Payment Sync">
        <div >
        <template if:true={isRed}>
         <div class="errorMessage">
           {messageDisplay}
        </div>
        </template>
        <template if:true={isGreen}>
         <div class="successMessage">
            {messageDisplay}
        </div>
         </template>
         <template if:true={isOrange}>
            <div class="warningMessage">
              WARNING: {warningDisplay}
           </div>
            </template>
        </div>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>
        </br>
        </br>
         <!-- <template if:true={isSync}>
            <div class="alreadySynced">
              {syncedMessage}
           </div>
         </template> -->

        <lightning-button 
        label="Payment Receipt Data Sync"
        onclick={validateBrokerData}
        disabled={isSyncButtonDisabled}
        class="slds-m-top_medium buttonmargin2">
        </lightning-button>
     
    </lightning-card>
    
</template>
