<template>
    <lightning-spinner if:true={isLoading} alternative-text="Loading" size="small"></lightning-spinner>
    <div class="slds-form-element">
        <!-- <label class="slds-form-element__label" for="combobox-id-1">
            <abbr class="slds-required" title="required">*</abbr>{labelName}</label> 
            class="slds-form-element__control" 
            class="slds-combobox_container"
            -->
        <div >
            <div >
                <div class={dropdownClasses} aria-expanded="false"
                    aria-haspopup="listbox" role="combobox">
                    <template if:false={selectedRecord}>
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_left-right" role="none">
                        <lightning-input type="search" label={labelName}
                            class="slds-combobox__input cap-input" onchange={handleInputChange}
                            onkeyup={handleInputChange} onkeydown={handleInputChange} role="textbox" onfocus={handleFocus}
                            onblur={handleBlur}
                            placeholder={placeholder} aria-controls="listbox-id-1" required></lightning-input>
                        </div>
                            <div if:true={searchRecords} id="listbox-id-1" class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template if:true={searchRecords} for:each={searchRecords} for:item="record"
                                    for:index="index">
                                    <li onclick={handleSelect} role="presentation" class="slds-listbox__item"
                                        data-record-id={record.Id} key={record.Id}>
                                        <div data-id={record.Id}
                                            class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                            role="option">
                                            <!-- <span class="slds-media__figure slds-listbox__option-icon">
                                                <span class="slds-icon_container slds-icon-standard-account">
                                                    <svg class="slds-icon slds-icon_small" aria-hidden="true">
                                                        <use xlink:href={ICON_URL}></use>0
                                                    </svg>
                                                </span>
                                            </span> -->
                                            <span class="slds-media__body">
                                                <span
                                                    class="slds-listbox__option-text slds-listbox__option-text_entity">
                                                    {record.FIELD1}
                                                </span>
                                                <span
                                                    class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                    {record.FIELD2} &nbsp; {record.FIELD3}
                                                </span>
                                            </span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <template if:true={selectedRecord}>
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                            role="none">
                            <template if:false={readOnly}>
                                <lightning-input type="search" label={labelName}
                                class="slds-combobox__input cap-input"
                                role="textbox"
                                value={selectedRecord.FIELD1} onchange={handleClose} required>
                                </lightning-input>
                            </template>
                            <template if:true={readOnly}>
                                <lightning-input type="text" label={labelName}
                                class="slds-combobox__input cap-input" disabled={readOnly}
                                role="textbox"
                                value={selectedRecord.FIELD1} onchange={handleClose} required>
                                </lightning-input>
                            </template>
                            
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
