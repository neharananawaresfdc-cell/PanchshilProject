        <template if:true={welcomeCallQuestions.length}>
            <!-- Responsive table wrapper -->
            <div>
                <table class="slds-table slds-table_bordered fixed-width-table">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="slds-text-title_caps" scope="col">
                                <div class="slds-truncate" title="Question">Question</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col" style="width: 120px;">
                                <div class="slds-truncate" title="Check">Check</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col" style="width: 200px;">
                                <div class="slds-truncate" title="Remark">Remark</div>
                            </th>
                            <th class="slds-text-title_caps" scope="col" style="width: 150px;">
                                <div class="slds-truncate" title="Checked By">Checked By</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={welcomeCallQuestions} for:item="question">
                            <tr key={question.Id}>
                                <td data-label="Question">
                                    <div class="slds-truncate" title={question.Question__c}>
                                        {question.Question__c}
                                    </div>
                                </td>
                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        name="valid"
                                        checked={question.Valid__c}
                                        data-id={question.Id}
                                        onchange={handleInputChange}
                                        disabled={disableFields}>
                                    </lightning-input>
                                </td>
                                <td data-label="Remark">
                                    <lightning-textarea
                                        name="remark"
                                        data-id={question.Id}
                                        value={question.Remarks__c}
                                        onchange={handleInputChange}
                                        disabled={disableFields}
                                        variant="label-hidden"
                                    ></lightning-textarea>
                                </td>
                                <td data-label="Checked By">
                                    <div class="slds-truncate" title={question.CreatedBy.Name}>
                                        {question.CreatedBy.Name}
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
            <!-- Single Invoice Status dropdown below all questions -->
            <lightning-layout class="slds-m-top_medium">
                <lightning-layout-item padding="around-small" size="4">
                    <lightning-combobox
                        label="Admin Checklist Status"
                        name="adminChecklist"
                        value={globalInvoiceStatus}
                        options={invoiceOptions}
                        onchange={handleGlobalInvoiceChange}
                        disabled={isInvoiceStatusApproved}
                        placeholder="Select Admin Checklist Status"
                        required="true">
                    </lightning-combobox>
                </lightning-layout-item>
            </lightning-layout>
            
            <!-- Centered button container -->
            <div class="slds-m-top_medium slds-text-align_center">
                <template if:false={disableFields}>
                    <template if:false={isInvoiceStatusApproved}>
                        <lightning-button 
                            label="Save Draft" 
                            onclick={handleSave}
                            class="slds-m-right_small">
                        </lightning-button>
                    </template>
                </template>
                <template if:true={welcomeCallQuestions.length}>
                    <template if:false={isInvoiceStatusApproved}>
                        <lightning-button 
                            label="Submit" 
                            onclick={handleSave} 
                            variant="brand"
                            class="slds-m-right_small"
                            disabled={isSubmitDisabled}>
                        </lightning-button>
                    </template>
                </template>
                <template if:true={showCancelBtn}>
                    <lightning-button 
                        label="Cancel" 
                        onclick={handleCancel}
                        variant="neutral">
                    </lightning-button>
                </template>
            </div>
        </template>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>
    </lightning-card>
</template>
