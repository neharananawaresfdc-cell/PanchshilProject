<template>
    <lightning-card variant="Narrow" title="Cancellation Sync" icon-name="utility:change_record_type">
        <div class="slds-p-horizontal_small">
            
                <template if:true={isRed}>
                    <div class="slds-text-color_destructive">
                        {messageDisplay}
                    </div>
                </template>
                <template if:true={isGreen}>
                    <div class="successMessage">
                        {messageDisplay}
                    </div>
                </template>
                <template if:true={isOrange}>
                    <div class="warningMessage">
                        WARNING: {warningDisplay}
                    </div>
                </template>
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>
            <br />
            <br />

            <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                <lightning-button 
                    label="Cancellation Sync"
                    icon-name="utility:refresh"
                    onclick={validateCancellationData}
                    disabled={isSyncButtonDisabled}
                    variant="brand"
                    class="slds-m-right_small">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
