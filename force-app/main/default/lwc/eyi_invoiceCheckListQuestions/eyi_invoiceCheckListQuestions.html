<template>
    <lightning-card>
        <!-- Combined Related Information Section -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="standard:related_list" size="small" class="slds-m-right_x-small"></lightning-icon>
                    REC Checklist - Related Information
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-gutters">
                    
                    <!-- Opportunity Information Column -->
                    <div class="slds-col slds-size_1-of-3">
                        <template if:true={hasOpportunityDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:opportunity" 
                                                  alternative-text="View Opportunity Record" 
                                                  size="small">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>Opportunity Information</strong>
                                    </p>
                                    <p class="slds-text-body_small">
                                        <a href={opportunityDisplayInfo.url} 
                                           target="_blank" 
                                           class="slds-text-link"
                                           onclick={handleOpportunityLinkClick}>
                                            🔗 {opportunityDisplayInfo.name}
                                        </a>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Click to view Opportunity details
                                    </p>
                                </div>
                            </div>
                        </template>
                        <template if:false={hasOpportunityDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:opportunity" 
                                                  alternative-text="No Opportunity Record" 
                                                  size="small"
                                                  class="slds-icon-text-default">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>Opportunity Information</strong>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        No Opportunity record found
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- REC Information Column -->
                    <div class="slds-col slds-size_1-of-3">
                        <template if:true={hasRECDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:record" 
                                                  alternative-text="View REC Record" 
                                                  size="small">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>REC Information</strong>
                                    </p>
                                    <p class="slds-text-body_small">
                                        <a href={recDisplayInfo.url} 
                                           target="_blank" 
                                           class="slds-text-link"
                                           onclick={handleRECLinkClick}>
                                            🔗 {recDisplayInfo.name}
                                        </a>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Click to view REC details
                                    </p>
                                </div>
                            </div>
                        </template>
                        <template if:false={hasRECDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:record" 
                                                  alternative-text="No REC Record" 
                                                  size="small"
                                                  class="slds-icon-text-default">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>REC Information</strong>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        No REC record found
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Brokerage Information Column -->
                    <div class="slds-col slds-size_1-of-3">
                        <template if:true={hasBrokerageDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:currency" 
                                                  alternative-text="View Brokerage Record" 
                                                  size="small">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>Brokerage Information</strong>
                                    </p>
                                    <p class="slds-text-body_small">
                                        <a href={brokerageDisplayInfo.url} 
                                           target="_blank" 
                                           class="slds-text-link"
                                           onclick={handleBrokerageLinkClick}>
                                            🔗 {brokerageDisplayInfo.name}
                                        </a>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        Click to view Brokerage details
                                    </p>
                                    <template if:true={brokerageDisplayInfo.amount}>
                                        <p class="slds-text-body_small">
                                            <strong>Amount:</strong> {brokerageDisplayInfo.amount}
                                        </p>
                                    </template>
                                    <template if:true={brokerageDisplayInfo.status}>
                                        <p class="slds-text-body_small">
                                            <strong>Status:</strong> {brokerageDisplayInfo.status}
                                        </p>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template if:false={hasBrokerageDetails}>
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:currency" 
                                                  alternative-text="No Brokerage Record" 
                                                  size="small"
                                                  class="slds-icon-text-default">
                                    </lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <p class="slds-text-body_regular">
                                        <strong>Brokerage Information</strong>
                                    </p>
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        No Brokerage record found
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Bank Details Section -->
        <!-- Show all active bank accounts -->
        <template if:true={bankDetails}>
            <template if:true={bankDetails.length}>
                <lightning-accordion allow-multiple-sections-open>
                    <lightning-accordion-section name="bankDetails" label="View All Bank Details">
                        <div class="slds-card slds-m-bottom_medium">
                            <div class="slds-card__header">
                                <h2 class="slds-card__header-title slds-text-heading_small">
                                    <lightning-icon icon-name="standard:account" size="small" class="slds-m-right_x-small"></lightning-icon>
                                    Active Bank Details
                            </h2>
                            </div>
                            <div class="slds-card__body slds-card__body_inner">
                                <div class="slds-grid slds-wrap">
                                    <template for:each={bankDetails} for:item="bank">
                                        <div key={bank.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                                            <div class="slds-box slds-theme_default">
                                                <a href={bank.url} target="_blank" class="slds-text-link">
                                                    <strong>{bank.Name}</strong>
                                                </a><br/>
                                                Bank Name: {bank.EYI_Bank_Name__c}<br/>
                                                Account Number: {bank.EYI_Bank_Account_Number__c}<br/>
                                                IFSC: {bank.EYI_IFSC_Code__c}
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </lightning-accordion-section>
                </lightning-accordion>
            </template>
            <template if:false={bankDetails.length}>
                <div class="slds-text-color_error slds-m-bottom_medium">
                    <lightning-icon icon-name="standard:account" size="small" class="slds-m-right_x-small"></lightning-icon>
                    No active bank details available or you do not have access to view them.
                </div>
            </template>
        </template>
        <template if:false={bankDetails}>
            <div class="slds-text-color_error slds-m-bottom_medium">
                <lightning-icon icon-name="standard:account" size="small" class="slds-m-right_x-small"></lightning-icon>
                No active bank details available or you do not have access to view them.
            </div>
        </template>

        <!-- Static Questions Table -->
        <div class="slds-card slds-m-bottom_medium">
            <div class="slds-card__header">
                <h2 class="slds-card__header-title slds-text-heading_small">
                    <lightning-icon icon-name="standard:currency"  size="small" class="slds-m-right_x-small"></lightning-icon>
                    Invoice Verification Checklist
                </h2>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-scrollable_x">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="slds-text-title_caps" scope="col">
                                    <div class="slds-truncate" title="Question">Question</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col" style="width: 200px;">
                                    <div class="slds-truncate" title="Current Value">Value</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col" style="width: 120px;">
                                    <div class="slds-truncate" title="Valid">Check</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col" style="width: 200px;">
                                    <div class="slds-truncate" title="Remark">Remark</div>
                                </th>
                                <th class="slds-text-title_caps" scope="col" style="width: 150px;">
                                    <div class="slds-truncate" title="Checked By">Checked By</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={staticQuestions} for:item="question">
                                <tr key={question.id}>
                                    <td data-label="Question">
                                        <div class="slds-truncate" title={question.label}>
                                           <lightning-formatted-rich-text value={question.label}></lightning-formatted-rich-text>
                                            <!-- <label class="slds-form-element__label">
                                                <div class="slds-text-body_regular">{question.label}</div>
                                                <div class="slds-text-body_small slds-text-color_weak">{question.sublabel}</div>
                                            </label> -->
                                        </div>
                                    </td>
                                    <td data-label="Current Value">
                                        <div class="slds-truncate" title={question.currentValue}>
                                            <template if:true={question.currentValue}>
                                                <!-- Use formatted rich text for bank details (sq5) to display line breaks -->
                                                <template if:true={question.id}>
                                                    <lightning-formatted-rich-text if:true={question.isBankDetails} value={question.currentValue}></lightning-formatted-rich-text>
                                                    <span if:false={question.isBankDetails}>{question.currentValue}</span>
                                                </template>
                                            </template>
                                            <template if:false={question.currentValue}>
                                                <span class="slds-text-color_weak">Not Available</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td>
                                        <lightning-input
                                            type="checkbox"
                                            name="valid"
                                            checked={question.valid}
                                            data-id={question.id}
                                            onchange={handleValidCheckboxChange}
                                            disabled={disableFields}>
                                        </lightning-input>
                                    </td>
                                    <td data-label="Remark">
                                        <lightning-textarea
                                            name="remark"
                                            data-id={question.id}
                                            value={question.remark}
                                            onchange={handleRemarkChange}
                                            disabled={disableFields}
                                            variant="label-hidden"
                                        ></lightning-textarea>
                                    </td>
                                    <td data-label="Checked By">
                                        <div class="slds-truncate" title={question.checkedBy}>
                                            <template if:true={question.checkedBy}>
                                                {question.checkedBy}
                                            </template>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Single Invoice Status dropdown below all questions -->
        <lightning-layout class="slds-m-top_medium">
            <lightning-layout-item padding="around-small" size="4">
                <lightning-combobox
                    name="globalInvoiceStatus"
                    label="Eligibility to raise Invoice"
                    value={globalInvoiceStatus}
                    placeholder="Select Status"
                    options={invoiceOptions}
                    onchange={handleGlobalInvoiceChange}
                    disabled={isInvoicePicklistDisabled}
                    required>
                </lightning-combobox>
                <!-- Add validation message -->
                <template if:true={showValidationMessage}>
                    <div class="slds-form-element__help slds-text-color_error">
                        All questions must be checked as valid before approving the invoice.
                    </div>
                </template>
                <!-- Add message when status is approved -->
                <template if:true={isInvoiceStatusApproved}>
                    <div class="slds-form-element__help slds-text-color_success">
                        Invoice status has been approved and cannot be changed.
                    </div>
                </template>
            </lightning-layout-item>
        </lightning-layout>
        
        <!-- Centered button container -->
        <div class="slds-m-top_medium slds-text-align_center">
            <template if:false={disableFields}>
                <template if:false={isInvoiceStatusApproved}>
                    <lightning-button 
                        label="Save Draft" 
                        onclick={handleSave}
                        class="slds-m-right_small">
                    </lightning-button>
                </template>
            </template>
            <template if:false={isInvoiceStatusApproved}>
                <lightning-button 
                    label="Submit" 
                    onclick={handleSave} 
                    variant="brand"
                    class="slds-m-right_small"
                    disabled={isSubmitDisabled}>
                </lightning-button>
            </template>
            <template if:true={showCancelBtn}>
                <lightning-button 
                    label="Cancel" 
                    onclick={handleCancel}
                    variant="neutral">
                </lightning-button>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        
    </lightning-card>
</template>
