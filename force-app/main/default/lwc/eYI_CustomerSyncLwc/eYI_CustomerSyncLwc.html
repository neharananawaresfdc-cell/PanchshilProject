<template>

    <lightning-card variant="Narrow" title="Customer Sync" icon-name="utility:change_record_type">
        <div class="slds-p-horizontal_small">
            
                <template if:true={isRed}>
                    <div class="slds-text-color_destructive">
                        {messageDisplay}
                    </div>
                </template>
                <template if:true={isGreen}>
                    <div class="successMessage">
                        {messageDisplay}
                    </div>
                </template>
                <template if:true={isOrange}>
                    <div class="warningMessage">
                        WARNING: {warningDisplay}
                    </div>
                </template>
            
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>
            </br>
            </br>
            <!--<lightning-button 
            label="Broker Validate Data"
            onclick={validateBrokerData}
            disabled={isValidateButtonDisabled}
            class="slds-m-top_medium buttonmargin1">
            </lightning-button>-->

            <div class="slds-grid slds-align_absolute-center slds-m-top_medium">
                <lightning-button 
                    label="Customer Sync Data"
                    icon-name="utility:refresh"
                    onclick={validateCustomerData}
                    variant="brand"
                    class="slds-m-right_small">
                </lightning-button>

                <!-- Create Payment Receipt Button -->
                <lightning-button 
                    label="Create Payment Receipt"
                    icon-name="utility:moneybag"
                    onclick={navigateToPaymentReceipt}
                    disabled={isPaymentSyncDisabled}
                    variant="brand">
                </lightning-button>
            </div>
            

        </div>
    </lightning-card>


</template>
