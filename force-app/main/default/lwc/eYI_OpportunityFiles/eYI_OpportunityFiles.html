 <template>
    <lightning-card title="File Preview and Download">
        <template if:true={flag}>
            <div class="slds-m-around_medium">
                <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">
                                <div class="slds-truncate" title="File Name">File Name</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Action">Action</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={filesList} for:item="file">
                            <tr key={file.value}>
                                <td>
                                    <div class="slds-truncate" title={file.label}>{file.label}</div>
                                </td>
                                <td>
                                    <lightning-button 
                                        label="Preview" 
                                        variant="Neutral" 
                                        data-id={file.value} 
                                        onclick={previewHandler}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template if:false={flag}>
            <div class="slds-m-around_medium">
                <p>No files found on this opportunity</p>
            </div>
        </template>
    </lightning-card>
</template>
